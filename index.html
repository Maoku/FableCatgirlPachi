<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FableCatgirlPachi</title>
  </head>
  <body>
    <div id="app">
      <div id="board-wrap">
        <div id="board"></div>
      </div>
      <aside id="panel">
        <h1>FableCatgirlPachi</h1>

        <section class="panel-section" id="play-panel">
          <div class="stock-row">
            持ち玉 <span id="stock" class="stock-num">500</span>
            <button id="refill-btn" class="small">+500 補給</button>
          </div>
          <label class="slider-label">
            発射強度 <span id="power-label">62</span>%
            <input type="range" id="power" min="0" max="100" value="62" />
          </label>
          <button id="fire-btn" class="big-btn">🚀 玉を打つ(長押し / Space)</button>
          <div class="pending-row">
            保留 <span id="pending-dots" class="pending-dots">○○○○</span>
            <span id="bonus-status" class="bonus-status"></span>
          </div>
          <div class="stats">
            <div>発射数 <span id="stat-launched">0</span></div>
            <div>スタート入賞 <span id="stat-starts">0</span></div>
            <div>大当り <span id="stat-wins">0</span></div>
            <div>差玉 <span id="stat-diff">0</span></div>
          </div>

          <div class="auto-box">
            <h2>🤖 自動プレイ</h2>
            <label class="auto-row">
              <input type="checkbox" id="auto-use-balls" checked />
              玉数上限 <input type="number" id="auto-balls" value="500" min="1" step="50" />発
            </label>
            <label class="auto-row">
              <input type="checkbox" id="auto-use-time" />
              時間上限 <input type="number" id="auto-minutes" value="5" min="1" step="1" />分
            </label>
            <button id="auto-btn" class="big-btn">▶ 自動プレイ開始</button>
            <div class="hint" id="auto-status">停止中</div>
          </div>
        </section>

        <section class="panel-section">
          <button id="mode-btn" class="big-btn secondary">🔧 エディットモードへ</button>
        </section>

        <section class="panel-section hidden" id="edit-panel">
          <div class="tools">
            <button data-tool="select" class="tool active">☝ 選択</button>
            <button data-tool="nail" class="tool">📍 釘</button>
            <button data-tool="wall" class="tool">📏 壁</button>
            <button data-tool="windmill" class="tool">🌀 風車</button>
            <button data-tool="pocket-start" class="tool">🎯 スタート</button>
            <button data-tool="pocket-attacker" class="tool">🎰 アタッカー</button>
            <button data-tool="pocket-out" class="tool">🕳 アウト</button>
          </div>
          <p class="hint">
            選択ツール: クリックで選択・ドラッグで移動 / 壁ツール: ドラッグで線を引く /
            変更は「プレイモードへ」で反映
          </p>
          <label class="slider-label">
            背景の明るさ <span id="brightness-label">50</span>%
            <input type="range" id="edit-brightness" min="10" max="100" value="50" />
          </label>
          <div id="props" class="hidden">
            <h3 id="prop-title">選択中: -</h3>
            <label class="prop-row" id="prop-radius-row">
              半径 <input type="number" id="prop-radius" min="2" max="80" step="0.5" />
            </label>
            <label class="prop-row" id="prop-speed-row">
              回転速度 (rad/s) <input type="number" id="prop-speed" min="-12" max="12" step="0.5" />
            </label>
            <label class="prop-row" id="prop-width-row">
              幅 <input type="number" id="prop-width" min="20" max="300" step="2" />
            </label>
            <label class="prop-row" id="prop-role-row">
              種別
              <select id="prop-role">
                <option value="start">スタート</option>
                <option value="attacker">アタッカー</option>
                <option value="out">アウト</option>
              </select>
            </label>
            <button id="delete-btn" class="danger">🗑 削除 (Delete)</button>
          </div>
          <div class="file-ops">
            <button id="export-btn">📤 エクスポート</button>
            <button id="import-btn">📥 インポート</button>
            <input type="file" id="import-file" accept="application/json" class="hidden" />
            <button id="reset-btn" class="danger">初期配置に戻す</button>
          </div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
